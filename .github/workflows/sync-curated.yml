name: Sync curated prompts

on:
  workflow_dispatch:
  schedule:
    # 00:00 Asia/Shanghai (UTC+8)
    - cron: '0 16 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require INFOFLOW_GITHUB_TOKEN
        env:
          INFOFLOW_GITHUB_TOKEN: ${{ secrets.INFOFLOW_GITHUB_TOKEN }}
        run: |
          if [ -z "${INFOFLOW_GITHUB_TOKEN}" ]; then
            echo "::error::Missing repository secret INFOFLOW_GITHUB_TOKEN. Add a GitHub PAT with read access to the private InfoFlow repository: Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Fetch curated source paths
        env:
          INFOFLOW_GITHUB_TOKEN: ${{ secrets.INFOFLOW_GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          set +x
          tmp="$(mktemp -d)"
          echo "INFOFLOW_TMP=${tmp}" >> "$GITHUB_ENV"
          src="${tmp}/InfoFlow"
          mkdir -p "$src"
          git -C "$src" init -q
          git -C "$src" remote add origin "https://github.com/shalom-lab/InfoFlow.git"
          git -C "$src" sparse-checkout init --cone
          git -C "$src" sparse-checkout set \
            data/prompt_featured.json \
            data/data_all_prompts.json \
            infoflow-data/Images/Prompt
          # Authenticate via header only; never put the token in a remote URL.
          git -C "$src" \
            -c http.extraheader="AUTHORIZATION: bearer ${INFOFLOW_GITHUB_TOKEN}" \
            fetch --depth 1 --quiet origin master
          git -C "$src" checkout --quiet FETCH_HEAD
          echo "INFOFLOW_SOURCE=${src}" >> "$GITHUB_ENV"

      - name: Sync curated public data
        run: python3 scripts/sync_curated.py --source "${INFOFLOW_SOURCE}" --dest .

      - name: Audit public tree
        run: python3 scripts/audit_public.py --source "${INFOFLOW_SOURCE}" --dest .

      - name: Remove private source checkout
        if: always()
        run: |
          if [ -n "${INFOFLOW_TMP:-}" ]; then
            rm -rf "${INFOFLOW_TMP}"
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/images
          if git diff --staged --quiet; then
            echo "No curated data changes"
          else
            git commit -m "chore: sync curated prompts"
            git push
          fi
